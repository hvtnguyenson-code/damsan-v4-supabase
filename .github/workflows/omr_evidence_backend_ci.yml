name: OMR Evidence Backend CI

on:
  pull_request:
    paths:
      - 'supabase/functions/omr-evidence/**'
      - 'docs/omr-evidence-ddl-proposal.sql'
      - 'supabase/config.toml'
      - 'tests/sql/omr_evidence_*.sql'
      - 'tests/sql/omr_room_cleanup_054_*.sql'
      - 'supabase/migrations/20261116195000_omr_room_storage_cleanup_054.sql'
      - 'supabase/migrations/20261116223000_omr_room_reset_storage_cleanup_055.sql'
      - 'tests/sql/omr_room_reset_055_*.sql'
      - 'tests/omr_evidence_free_auth_guard.js'
      - 'tests/omr_evidence_live_deny_047.mjs'
      - '.github/workflows/omr_evidence_backend_ci.yml'
  workflow_dispatch:

jobs:
  deno-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: omr_evidence_test_only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check OMR Evidence Edge Function
        run: deno check supabase/functions/omr-evidence/index.ts
      - name: Assert custom staff session configuration (Free-only)
        run: node tests/omr_evidence_free_auth_guard.js
      - name: Test evidence DDL on disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="${{ job.services.postgres.id }}"
          test -n "$PG_CONTAINER"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/omr_evidence_fixture.sql
          # Twice ensures schema/bucket migration can be retried safely.
          for attempt in 1 2; do
            docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < docs/omr-evidence-ddl-proposal.sql
          done
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/omr_evidence_assertions.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/omr_room_cleanup_054_fixture.sql
          # Idempotent permissions and database functions, on ephemeral test PostgreSQL only.
          for attempt in 1 2; do
            docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261116195000_omr_room_storage_cleanup_054.sql
          done
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/omr_room_cleanup_054_assertions.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/omr_room_reset_055_fixture.sql
          for attempt in 1 2; do
            docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261116223000_omr_room_reset_storage_cleanup_055.sql
          done
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/sql/omr_room_reset_055_assertions.sql
      - name: OMR 047 live unauthorized Edge access (no credentials, no writes)
        run: node tests/omr_evidence_live_deny_047.mjs
