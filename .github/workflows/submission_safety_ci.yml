name: Submission Safety CI

on:
  pull_request:
  push:
    branches:
      - 'fix/submission-safety-p0-*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check hoc_sinh.js
          node --check giaovien.js
          node --check sw.js
          node --check print_docx_exporter.js
          node --check canonical_exam_print_bridge.js
          node --check teacher_canonical_export_079.js
          node --check tests/canonical_room_docx_export_079_simulation.js
          node --check knowledge.js
          node --check knowledge_reader.js
          node --check knowledge_reader_hardening.js
          node --check knowledge_normalized_source.js
          node --check knowledge_chunked_normalization.js
          node --check knowledge_ai_web.js
          node --check knowledge_ai_hardening.js
          node --check ai_exam.js
          node --check ai_exam_resilience.js
          node --check ai_exam_copy_feedback.js
          node --check ai_exam_assessment_profile.js
          node --check ai_exam_validation_architecture_053.js
          node --check ai_exam_part2_quality_054.js
          node --check ai_exam_part3_presentation_055.js
          node --check ai_exam_creative_envelope_060.js
          node --check ai_exam_quality_review_053.js
          node --check ai_exam_discrimination_quality_062.js
          node --check ai_exam_grade_authority.js
          node --check ai_action_feedback.js
          node --check tests/browser_ocr_runtime_probe.js
          node --check tests/run_browser_ocr_probe.mjs
          node --check tests/native_docx_print_export_077_simulation.js
          node --check tests/browser_native_docx_runtime_probe.js
          node --check tests/run_native_docx_browser_probe.mjs
          node --check tests/android_pwa_installability_081_simulation.js
          node --check tests/student_runtime_local_deps_081a_simulation.js
          node --check tests/run_android_pwa_browser_probe_081.mjs
          node --check tests/browser_canonical_print_metadata_probe.js
          node --check tests/run_canonical_print_metadata_browser_probe.mjs
          node --check tests/ai_exam_copy_feedback_simulation.js
          node --check tests/ai_geography_assessment_standard_simulation.js
          node --check tests/ai_geography_part3_quality_048_simulation.js
          node --check tests/ai_geography_part2_quality_054_simulation.js
          node --check tests/ai_geography_all_grade_part2_standard_069_simulation.js
          node --check tests/ai_geography_part3_presentation_055_simulation.js
          node --check tests/ai_geography_part3_authentic_data_071_simulation.js
          node --check tests/ai_exam_publish_revalidate_071a_simulation.js
          node --check tests/ai_geography_part3_trusted_external_072_simulation.js
          node --check tests/ai_geography_creative_envelope_060_simulation.js
          node --check tests/ai_geography_discrimination_quality_062_simulation.js
          node --check tests/ai_exam_capability_reissue_063_simulation.js
          node --check tests/ai_exam_validation_feedback_073_simulation.js
          node --check tests/ai_exam_item_writing_quality_074_simulation.js
          node --check tests/normalized_knowledge_authority_simulation.js
          node --check tests/normalized_source_subject_binding_040a_simulation.js
          node --check tests/ai_action_feedback_041a_simulation.js
          node --check tests/chunked_normalization_042_simulation.js
          node --check tests/ai_room_boundary_invariant_simulation.js
          node --check tests/teacher_dashboard_refresh_082_simulation.js
          node --check admin_system_status_083a.js
          node --check tests/admin_system_status_083a_simulation.js
          node --check admin_system_maintenance_083b.js
          node --check tests/admin_maintenance_cleanup_083b_simulation.js
      - name: Admin maintenance cleanup 083B simulation
        run: node tests/admin_maintenance_cleanup_083b_simulation.js
      - name: Admin system status 083A simulation
        run: node tests/admin_system_status_083a_simulation.js
      - name: Teacher dashboard refresh 082 simulation
        run: node tests/teacher_dashboard_refresh_082_simulation.js
      - name: Android PWA installability static probe
        run: |
          node tests/android_pwa_installability_081_simulation.js
          node tests/student_runtime_local_deps_081a_simulation.js
          python3 - <<'PY'
          import struct
          from pathlib import Path

          for path, expected in [
              ('icons/exam-192.png', (192, 192)),
              ('icons/exam-512.png', (512, 512)),
          ]:
              data = Path(path).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{path}: invalid PNG signature'
              assert data[12:16] == b'IHDR', f'{path}: missing IHDR'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == expected, f'{path}: expected {expected}, got {(width, height)}'
          print('PASS local PWA PNG icons 192/512')
          PY
      - name: Android Chrome PWA runtime probe
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/pwa-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-timer-throttling \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9235 \
            --user-data-dir=/tmp/damsan-pwa-chrome \
            about:blank >/tmp/pwa-chrome.out 2>/tmp/pwa-chrome.log &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8768/hoc_sinh.html >/dev/null && curl -fsS http://127.0.0.1:9235/json/version >/dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 100s node tests/run_android_pwa_browser_probe_081.mjs
          PROBE_EXIT=$?
          set -e
          echo "=== Android PWA Chrome diagnostics ==="
          tail -n 120 /tmp/pwa-chrome.log || true
          exit "$PROBE_EXIT"
      - name: Browser OCR runtime probe
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ocr-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-timer-throttling \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/damsan-ocr-chrome \
            about:blank >/tmp/ocr-chrome.out 2>/tmp/ocr-chrome.log &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/tests/browser_ocr_runtime_probe.html >/dev/null && curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 145s node tests/run_browser_ocr_probe.mjs
          PROBE_EXIT=$?
          set -e
          echo "=== Chrome diagnostics ==="
          tail -n 120 /tmp/ocr-chrome.log || true
          exit "$PROBE_EXIT"
      - name: Native DOCX package probe
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/docx-9.10.0.cjs https://cdn.jsdelivr.net/npm/docx@9.10.0/dist/index.umd.cjs
          node - <<'NODE'
          const fs = require('fs');
          const docx = require('/tmp/docx-9.10.0.cjs');
          const doc = new docx.Document({
            sections: [{
              properties: {
                page: {
                  size: { width: 11906, height: 16838, orientation: docx.PageOrientation.PORTRAIT },
                  margin: { top: 1134, right: 1134, bottom: 1134, left: 1134 }
                }
              },
              footers: {
                default: new docx.Footer({
                  children: [new docx.Paragraph({
                    children: [new docx.TextRun({ children: ['Trang ', docx.PageNumber.CURRENT, ' / ', docx.PageNumber.TOTAL_PAGES] })]
                  })]
                })
              },
              children: [new docx.Paragraph('DAMSAN NATIVE DOCX 077')]
            }]
          });
          docx.Packer.toBuffer(doc).then((buffer) => {
            fs.writeFileSync('/tmp/native-docx-077.docx', buffer);
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          python3 - <<'PY'
          import zipfile
          path = '/tmp/native-docx-077.docx'
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              required = {'[Content_Types].xml', 'word/document.xml', 'word/_rels/document.xml.rels'}
              missing = required - names
              assert not missing, f'missing OOXML parts: {missing}'
              xml = z.read('word/document.xml').decode('utf-8')
              assert 'DAMSAN NATIVE DOCX 077' in xml
          print('PASS native DOCX OOXML package probe')
          PY
          node tests/native_docx_print_export_077_simulation.js
      - name: Native DOCX browser runtime probe
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/docx-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-timer-throttling \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9233 \
            --user-data-dir=/tmp/damsan-docx-chrome \
            about:blank >/tmp/docx-chrome.out 2>/tmp/docx-chrome.log &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/tests/browser_native_docx_runtime_probe.html >/dev/null && curl -fsS http://127.0.0.1:9233/json/version >/dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 100s node tests/run_native_docx_browser_probe.mjs
          PROBE_EXIT=$?
          set -e
          echo "=== DOCX Chrome diagnostics ==="
          tail -n 120 /tmp/docx-chrome.log || true
          if [ "$PROBE_EXIT" -ne 0 ]; then
            exit "$PROBE_EXIT"
          fi
          python3 - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET

          path = '/tmp/native-docx-browser-078.docx'
          NS = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with zipfile.ZipFile(path) as z:
              root = ET.fromstring(z.read('word/document.xml'))

          paras = []
          body = root.find('w:body', NS)
          for child in list(body):
              if child.tag != '{%s}p' % NS['w']:
                  continue
              text = ''.join((t.text or '') for t in child.findall('.//w:t', NS))
              paras.append(text)

          q_index = next(i for i, t in enumerate(paras) if 'Câu 1:' in t)
          assert q_index + 1 < len(paras), paras
          assert paras[q_index + 1].startswith('A. Một'), paras[q_index:q_index+3]
          print('PASS no empty DOCX paragraph between question and answers')
          PY
      - name: Canonical room print metadata browser probe
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/print-meta-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-timer-throttling \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9234 \
            --user-data-dir=/tmp/damsan-print-meta-chrome \
            about:blank >/tmp/print-meta-chrome.out 2>/tmp/print-meta-chrome.log &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/tests/browser_canonical_print_metadata_probe.html >/dev/null && curl -fsS http://127.0.0.1:9234/json/version >/dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 100s node tests/run_canonical_print_metadata_browser_probe.mjs
          PROBE_EXIT=$?
          set -e
          echo "=== Canonical print metadata Chrome diagnostics ==="
          tail -n 120 /tmp/print-meta-chrome.log || true
          exit "$PROBE_EXIT"
      - name: Canonical room DOCX export simulation
        run: node tests/canonical_room_docx_export_079_simulation.js
      - name: Submission safety simulation
        run: node tests/submission_safety_simulation.js
      - name: Account import regression simulations
        run: |
          node tests/admin_control_plane_server_simulation.js
          node tests/admin_frontend_session_simulation.js
          node tests/logout_session_race_simulation.js
          node tests/account_import_server_simulation.js
          node tests/account_import_excel_loader_simulation.js
          node tests/account_import_exceljs_csp_simulation.js
          node tests/student_password_change_simulation.js
          node tests/flex_lite_scoring_server_simulation.js
          node tests/flex_lite_teacher_config_server_simulation.js
          node tests/flex_lite_teacher_config_frontend_simulation.js
          node tests/flex_lite_authoritative_score_presentation_simulation.js
          node tests/student_result_session_error_handling_simulation.js
          node tests/teacher_dashboard_action_reliability_simulation.js
          node tests/teacher_room_control_action_reliability_simulation.js
