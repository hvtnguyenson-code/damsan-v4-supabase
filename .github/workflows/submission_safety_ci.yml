name: Submission Safety CI

on:
  pull_request:
  push:
    branches:
      - 'fix/submission-safety-p0-*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check hoc_sinh.js
          node --check giaovien.js
          node --check sw.js
          node --check knowledge.js
          node --check knowledge_reader.js
          node --check knowledge_reader_hardening.js
          node --check knowledge_normalized_source.js
          node --check knowledge_ai_web.js
          node --check knowledge_ai_hardening.js
          node --check ai_exam.js
          node --check ai_exam_resilience.js
          node --check ai_exam_copy_feedback.js
          node --check ai_exam_assessment_profile.js
          node --check ai_exam_grade_authority.js
          node --check tests/browser_ocr_runtime_probe.js
          node --check tests/run_browser_ocr_probe.mjs
          node --check tests/ai_exam_copy_feedback_simulation.js
          node --check tests/ai_geography_assessment_standard_simulation.js
          node --check tests/normalized_knowledge_authority_simulation.js
          node --check tests/normalized_source_subject_binding_040a_simulation.js
          node --check tests/ai_room_boundary_invariant_simulation.js
      - name: Browser OCR runtime probe
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ocr-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-timer-throttling \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/damsan-ocr-chrome \
            about:blank >/tmp/ocr-chrome.out 2>/tmp/ocr-chrome.log &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/tests/browser_ocr_runtime_probe.html >/dev/null && curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 145s node tests/run_browser_ocr_probe.mjs
          PROBE_EXIT=$?
          set -e
          echo "=== Chrome diagnostics ==="
          tail -n 120 /tmp/ocr-chrome.log || true
          exit "$PROBE_EXIT"
      - name: Submission safety simulation
        run: node tests/submission_safety_simulation.js
      - name: Account import regression simulations
        run: |
          node tests/admin_control_plane_server_simulation.js
          node tests/admin_frontend_session_simulation.js
          node tests/logout_session_race_simulation.js
          node tests/account_import_server_simulation.js
          node tests/account_import_excel_loader_simulation.js
          node tests/account_import_exceljs_csp_simulation.js
          node tests/student_password_change_simulation.js
          node tests/flex_lite_scoring_server_simulation.js
          node tests/flex_lite_teacher_config_server_simulation.js
          node tests/flex_lite_teacher_config_frontend_simulation.js
          node tests/flex_lite_authoritative_score_presentation_simulation.js
          node tests/student_result_session_error_handling_simulation.js
          node tests/teacher_dashboard_action_reliability_simulation.js
          node tests/teacher_room_control_action_reliability_simulation.js
          node tests/teacher_room_chronological_ordering_simulation.js
          node tests/teacher_radar_stable_dom_no_flicker_simulation.js
          node tests/knowledge_ingestion_foundation_simulation.js
          node tests/knowledge_upload_gateway_simulation.js
          node tests/knowledge_automatic_reader_simulation.js
          node tests/knowledge_ai_semantic_bridge_simulation.js
          node tests/ai_exam_generation_bridge_simulation.js
          node tests/knowledge_web_ai_handoff_simulation.js
          node tests/ai_exam_review_ui_simulation.js
          node tests/ai_exam_copy_feedback_simulation.js
          node tests/ai_geography_assessment_standard_simulation.js
          node tests/normalized_knowledge_authority_simulation.js
          node tests/normalized_source_subject_binding_040a_simulation.js
          node tests/ai_room_boundary_invariant_simulation.js
          node tests/ai_authoring_navigation_resilience_simulation.js
          node tests/knowledge_ocr_usability_gate_simulation.js
      - name: Whitespace errors in branch diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check HEAD^...HEAD
          fi
