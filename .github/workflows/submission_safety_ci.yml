          node tests/ai_exam_copy_feedback_simulation.js
          node tests/ai_geography_assessment_standard_simulation.js
          node tests/ai_geography_part3_quality_048_simulation.js
          node tests/ai_geography_part2_quality_054_simulation.js
          node tests/ai_geography_all_grade_part2_standard_069_simulation.js
          node tests/ai_geography_part3_presentation_055_simulation.js
          node tests/ai_geography_part3_authentic_data_071_simulation.js
          node tests/ai_exam_publish_revalidate_071a_simulation.js
          node tests/ai_geography_part3_trusted_external_072_simulation.js
          node tests/ai_geography_creative_envelope_060_simulation.js
          node tests/ai_geography_discrimination_quality_062_simulation.js
          node tests/ai_exam_capability_reissue_063_simulation.js
          node tests/ai_exam_validation_feedback_073_simulation.js
          node tests/ai_exam_item_writing_quality_074_simulation.js
          node tests/normalized_knowledge_authority_simulation.js
          node tests/normalized_source_subject_binding_040a_simulation.js
          node tests/ai_action_feedback_041a_simulation.js
          node tests/chunked_normalization_042_simulation.js
