      - name: Whitespace errors in branch diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "origin/${{ github.base_ref }}...HEAD" -- . ':(exclude)vendor/student/**'
          else
            git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check HEAD^...HEAD -- . ':(exclude)vendor/student/**'
          fi
