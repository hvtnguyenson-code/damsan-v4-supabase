name: AI Geography FLEX Matrix 111-113 CI

on:
  pull_request:
    paths:
      - 'ai_exam.html'
      - 'ai_exam_geography_curriculum_catalog_114.js'
      - 'ai_exam_geography_matrix_111.js'
      - 'ai_exam_planned_activation_109.js'
      - 'supabase/functions/exam-ai-bridge/index.ts'
      - 'supabase/functions/_shared/exam_planned_generation_105.ts'
      - 'supabase/functions/_shared/exam_geography_flex_matrix_112.ts'
      - 'supabase/functions/_shared/exam_geography_calibration_108.ts'
      - 'tests/ai_geography_curriculum_catalog_114_simulation.js'
      - 'tests/ai_geography_flex_matrix_111_113_simulation.js'
      - 'tests/ai_geography_flex_matrix_112_runtime.ts'
      - 'tests/ai_geography_activation_109_simulation.js'
      - 'ops/rollback/exam-ai-bridge-v5-before-flex-20261105.ts'
      - '.github/workflows/ai_geography_flex_matrix_111_113_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Browser matrix syntax and static invariants
        run: |
          node --check ai_exam_geography_curriculum_catalog_114.js
          node --check ai_exam_geography_matrix_111.js
          node --check ai_exam_planned_activation_109.js
          node --check tests/ai_geography_curriculum_catalog_114_simulation.js
          node --check tests/ai_geography_flex_matrix_111_113_simulation.js
          node tests/ai_geography_curriculum_catalog_114_simulation.js
          node tests/ai_geography_flex_matrix_111_113_simulation.js
          node tests/ai_geography_activation_109_simulation.js
      - name: Deno type checks
        run: |
          deno check supabase/functions/_shared/exam_geography_flex_matrix_112.ts
          deno check supabase/functions/_shared/exam_planned_generation_105.ts
          deno check supabase/functions/_shared/exam_geography_calibration_108.ts
          deno check supabase/functions/exam-ai-bridge/index.ts
          deno check tests/ai_geography_flex_matrix_112_runtime.ts
      - name: FLEX and STRICT runtime acceptance
        run: deno run tests/ai_geography_flex_matrix_112_runtime.ts
      - name: Existing strict planned runtime
        run: deno run tests/ai_geography_planned_generation_105_runtime.ts
      - name: Existing P4-P6 runtime
        run: deno run tests/ai_geography_p4_p6_runtime.ts
      - name: Whitespace errors
        run: git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "origin/${{ github.base_ref }}...HEAD"
