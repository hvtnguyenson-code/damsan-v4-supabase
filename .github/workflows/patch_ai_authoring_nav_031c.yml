name: Temporary AI authoring nav patch 031C

on:
  push:
    branches:
      - 'feat/ai-authoring-navigation-031c'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-authoring-navigation-031c
          fetch-depth: 0
      - name: Insert AI authoring entries into teacher sidebar
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('giaovien.html')
          data = path.read_bytes()
          marker = '''                            <button id="btnSubDirect" class="active" onclick="switchSubTabTaoDe('direct'); closeSidebarMobile()">⚡ Tạo Đề Thi Online</button>'''.encode('utf-8')
          newline = b'\r\n' if b'\r\n' in data else b'\n'
          extra = newline.join([
              '''                            <button id="btnSubKnowledgeAI" onclick="window.location.href='knowledge.html'; closeSidebarMobile()">🧠 Kho tri thức AI</button>'''.encode('utf-8'),
              '''                            <button id="btnSubKnowledgeAnalyze" onclick="window.location.href='knowledge_ai.html'; closeSidebarMobile()">✨ AI phân tích nguồn</button>'''.encode('utf-8'),
              '''                            <button id="btnSubAiExam" onclick="window.location.href='ai_exam.html'; closeSidebarMobile()">🤖 Tạo đề bằng AI</button>'''.encode('utf-8'),
          ])
          if b'id="btnSubAiExam"' in data:
              print('AI navigation already present; no change required.')
          else:
              if data.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one teacher sidebar marker, found {data.count(marker)}')
              path.write_bytes(data.replace(marker, marker + newline + extra, 1))
          PY
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          if git diff --quiet -- giaovien.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add giaovien.html
          git commit -m "feat(ai): expose knowledge and exam authoring in teacher sidebar"
          git push origin HEAD:feat/ai-authoring-navigation-031c
