name: OMR Camera Grading CI

on:
  pull_request:
    paths:
      - 'omr/**'
      - 'giaovien.html'
      - 'teacher/**'
      - 'tests/omr_*'
      - 'tests/run_omr_061_browser_lab.mjs'
      - 'tests/run_omr_062_fieldtrial_browser.mjs'
      - 'tests/sql/omr_061_postgres_contract.sql'
      - 'tests/teacher_pwa_006_simulation.js'
      - 'tests/teacher_navigation_011_simulation.js'
      - 'tests/teacher_password_012_simulation.js'
      - 'tests/teacher_pwa_install_entry_007_simulation.js'
      - 'tests/run_teacher_pwa_installability_probe_008.mjs'
      - 'supabase/migrations/20261105143000_omr_staff_submission_004.sql'
      - 'supabase/functions/omr-evidence/**'
      - 'docs/omr-evidence-ddl-proposal.sql'
      - '.github/workflows/omr_camera_grading_ci.yml'
  workflow_dispatch:

jobs:
  omr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: OMR 001 core
        run: node tests/omr_core_001_simulation.js
      - name: OMR 009 calibrated ink regression
        run: node tests/omr_evidence_009_simulation.js
      - name: OMR 013 illumination and erasure candidate (offline)
        run: node tests/omr_reliability_013_simulation.js
      - name: OMR 014 internal marker geometry (offline)
        run: node tests/omr_geometry_014_simulation.js
      - name: OMR 015 opt-in field testing and no-write gate
        run: node tests/omr_v6_trial_015_simulation.js
      - name: OMR 016 V6 false-review and eraser evidence
        run: node tests/omr_v6_false_review_016_simulation.js
      - name: OMR 017 independent V6 P3 grammar and illumination
        run: node tests/omr_v6_p3_017_simulation.js
      - name: OMR 018 official V6 through canonical scoring and write
        run: node tests/omr_v6_official_018_simulation.js
      - name: OMR 019 mobile room header layout
        run: node tests/omr_mobile_room_layout_019_simulation.js
      - name: OMR 021 desktop/PWA V6 parity and safe fallback
        run: node tests/omr_desktop_pwa_v6_parity_021_simulation.js
      - name: OMR 022 V6 default on open and valid pending V5 draft
        run: node tests/omr_default_v6_022_simulation.js
      - name: OMR 023 isolated V7 research candidate
        run: node tests/omr_v7_candidate_023_simulation.js
      - name: OMR 024 V7 full P1 P2 P3 offline
        run: node tests/omr_v7_full_024_simulation.js
      - name: OMR 026 V7 PWA canonical write path and guards
        run: node tests/omr_v7_pwa_026_simulation.js
      - name: OMR 027 V6/V7 read-only same-image PWA comparison
        run: node tests/omr_v7_compare_027_simulation.js
      - name: OMR 028 installed PWA JS cache freshness
        run: node tests/omr_v7_pwa_cache_028_simulation.js
      - name: OMR 029 legacy installed PWA V7 runtime recovery
        run: node tests/omr_v7_legacy_bridge_029_simulation.js
      - name: OMR 031 V7 equals copied V6 baseline
        run: node tests/omr_v7_baseline_031_simulation.js
      - name: OMR 032 V7 opt-in conservative local refinement
        run: node tests/omr_v7_local_refinement_032_simulation.js
      - name: OMR 033 V7 combined multi-module regression
        run: node tests/omr_v7_complete_033_simulation.js
      - name: OMR 034 V7 P3 empty-question conservative recovery
        run: node tests/omr_v7_p3_blank_034_simulation.js
      - name: OMR 035 PWA V7 release parity and read-only
        run: node tests/omr_v7_pwa_release_035_simulation.js
      - name: OMR 036 V7 P3 0-to-6 sparse independent calibration
        run: node tests/omr_v7_p3_sparse_036_simulation.js
      - name: OMR 037 V7 photographed sparse P3 evidence
        run: node tests/omr_v7_p3_photo_evidence_037_simulation.js
      - name: OMR 038 V7 sparse blank consensus and vetoes
        run: node tests/omr_v7_p3_consensus_038_simulation.js
      - name: OMR 039 V7 local multi-marker geometry and read-only overlay
        run: node tests/omr_v7_geometry_overlay_039_simulation.js
      - name: OMR 040 V7 independent read-only score when V6 P3 fails
        run: node tests/omr_v7_lab_independent_score_040_simulation.js
      - name: OMR 041 V7 sole official writer full refinement and safety
        run: node tests/omr_v7_official_041_simulation.js
      - name: OMR 042 two-decimal score display (V7)
        run: node tests/omr_v7_score_display_042_simulation.js
      - name: OMR 043 V7 fixed overlay and mobile identity layout
        run: node tests/omr_v7_mobile_ui_043_simulation.js
      - name: OMR 044 V7 correct/wrong evidence colors and manual edits
        run: node tests/omr_v7_evidence_044_simulation.js
      - name: OMR 045 private evidence and Excel/ZIP integration
        run: node tests/omr_v7_evidence_integration_045_simulation.js
      - name: OMR 048 mobile evidence export ZIP with durable download link
        run: node tests/omr_evidence_mobile_export_048_simulation.js
      - name: OMR 049 ZIP date-time metadata valid local and central header
        run: node tests/omr_evidence_zip_timestamp_049_simulation.js
      - name: OMR 050 Vietnamese student filename and authoritative room roster
        run: node tests/omr_room_evidence_050_simulation.js
      - name: OMR 051 full-room Excel and Unicode ZIP linkage
        run: node tests/omr_room_evidence_export_051_simulation.js
      - name: OMR 052 printable A4 PDF-only evidence ZIP
        run: node tests/omr_evidence_print_052_simulation.js
      - name: OMR 053 desktop private evidence viewer CSP and blob lifecycle
        run: node tests/omr_room_evidence_preview_053_simulation.js
      - name: OMR 054 room-scoped Storage cleanup before DB delete
        run: node tests/omr_room_delete_054_simulation.js
      - name: OMR 055 full room score reset clears private evidence
        run: node tests/omr_room_reset_055_simulation.js
      - name: OMR 056 one final evidence per student after score save
        run: node tests/omr_one_final_evidence_056_simulation.js
      - name: OMR 057 official evidence in all exam rooms without test quota
        run: node tests/omr_official_evidence_057_simulation.js
      - name: OMR 058 opt-in Precision Capture preflight safety
        run: node tests/omr_precision_capture_experiment_058_simulation.js
      - name: OMR 059 durable evidence queue / async uploads
        run: node tests/omr_precision_save_queue_059_simulation.js
      - name: OMR 060 isolated optimization 18-4-6 and camera geometry
        run: node tests/omr_v7_optimization_060_simulation.js
      - name: OMR 060 ink topology and erasure diagnostics
        run: node tests/omr_v7_ink_060_simulation.js
      - name: OMR 060 writer boundary and dry-run save safety
        run: node tests/omr_060_writer_safety_simulation.js
      - name: OMR 061 isolated lab and durable local integration (no live DB)
        run: node tests/omr_060_integration_061_simulation.js
      - name: OMR 066 independent multi-hypothesis fiducial and negative-case regression
        run: node tests/omr_066_multihypothesis_fiducial_simulation.js
      - name: OMR 062 field trial PWA offline and data safety static gate
        run: node tests/omr_062_fieldtrial_static_simulation.js
      - name: Teacher PWA refresh restoration 020
        run: node tests/teacher_refresh_restore_020_simulation.js
      - name: OMR 010 teacher photo preview
        run: node tests/omr_photo_preview_010_simulation.js
      - name: OMR 002 room binding
        run: node tests/omr_room_binding_002_simulation.js
      - name: OMR 003 scoring parity
        run: node tests/omr_v4_scoring_003_simulation.js
      - name: OMR 004 canonical result write
        run: node tests/omr_result_write_004_simulation.js
      - name: OMR 005 batch UX
        run: node tests/omr_batch_ux_005_simulation.js
      - name: Teacher PWA Android Back navigation 011
        run: node tests/teacher_navigation_011_simulation.js
      - name: Teacher PWA password manager 012
        run: node tests/teacher_password_012_simulation.js
      - name: Desktop teacher password vault 096
        run: node tests/desktop_teacher_password_vault_096_simulation.js
      - name: Browser password vault feedback 097
        run: node tests/teacher_password_vault_097_regression.js
      - name: Teacher PWA 006
        run: node tests/teacher_pwa_006_simulation.js
      - name: Teacher PWA install entry 007
        run: node tests/teacher_pwa_install_entry_007_simulation.js
      - name: Teacher PWA Chromium installability 008
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/teacher-pwa-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --disable-background-timer-throttling             --remote-debugging-address=127.0.0.1             --remote-debugging-port=9236             --user-data-dir=/tmp/damsan-teacher-pwa-chrome             about:blank >/tmp/teacher-pwa-chrome.out 2>/tmp/teacher-pwa-chrome.log &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/teacher/index.html >/dev/null && curl -fsS http://127.0.0.1:9236/json/version >/dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 100s node tests/run_teacher_pwa_installability_probe_008.mjs
          PROBE_EXIT=$?
          if [ "$PROBE_EXIT" -eq 0 ]; then
            timeout 50s node tests/run_teacher_omr_mobile_layout_probe_043.mjs
            PROBE_EXIT=$?
          fi
          if [ "$PROBE_EXIT" -eq 0 ]; then
            timeout 70s node tests/run_teacher_omr_evidence_browser_probe_046.mjs
            PROBE_EXIT=$?
          fi
          if [ "$PROBE_EXIT" -eq 0 ]; then
            timeout 45s node tests/run_teacher_omr_unified_mobile_052.mjs
            PROBE_EXIT=$?
          fi
          set -e
          if [ "$PROBE_EXIT" -eq 0 ]; then
            timeout 75s node tests/run_omr_061_browser_lab.mjs
            PROBE_EXIT=$?
          fi
          if [ "$PROBE_EXIT" -eq 0 ]; then
            timeout 120s node tests/run_omr_062_fieldtrial_browser.mjs
            PROBE_EXIT=$?
          fi
          echo "=== Teacher PWA Chrome diagnostics ==="
          tail -n 120 /tmp/teacher-pwa-chrome.log || true
          exit "$PROBE_EXIT"

  postgres_contract:
    name: OMR 061 isolated PostgreSQL 17 writer contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omr061
          POSTGRES_PASSWORD: omr061_ci_only
          POSTGRES_DB: omr061
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omr061 -d omr061"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Run actual checked-in OMR writer SQL in a rolled-back synthetic transaction
        env:
          PGPASSWORD: omr061_ci_only
        run: |
          psql --version
          psql -h 127.0.0.1 -p 5432 -U omr061 -d omr061 -v ON_ERROR_STOP=1 -f tests/sql/omr_061_postgres_contract.sql
