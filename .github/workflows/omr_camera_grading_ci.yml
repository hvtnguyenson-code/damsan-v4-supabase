name: OMR Camera Grading CI

on:
  pull_request:
    paths:
      - 'omr/**'
      - 'giaovien.html'
      - 'teacher/**'
      - 'tests/omr_*'
      - 'tests/teacher_pwa_006_simulation.js'
      - 'tests/teacher_navigation_011_simulation.js'
      - 'tests/teacher_password_012_simulation.js'
      - 'tests/teacher_pwa_install_entry_007_simulation.js'
      - 'tests/run_teacher_pwa_installability_probe_008.mjs'
      - 'supabase/migrations/20261105143000_omr_staff_submission_004.sql'
      - '.github/workflows/omr_camera_grading_ci.yml'
  workflow_dispatch:

jobs:
  omr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: OMR 001 core
        run: node tests/omr_core_001_simulation.js
      - name: OMR 009 calibrated ink regression
        run: node tests/omr_evidence_009_simulation.js
      - name: OMR 013 illumination and erasure candidate (offline)
        run: node tests/omr_reliability_013_simulation.js
      - name: OMR 014 internal marker geometry (offline)
        run: node tests/omr_geometry_014_simulation.js
      - name: OMR 015 opt-in field testing and no-write gate
        run: node tests/omr_v6_trial_015_simulation.js
      - name: OMR 016 V6 false-review and eraser evidence
        run: node tests/omr_v6_false_review_016_simulation.js
      - name: OMR 017 independent V6 P3 grammar and illumination
        run: node tests/omr_v6_p3_017_simulation.js
      - name: OMR 018 official V6 through canonical scoring and write
        run: node tests/omr_v6_official_018_simulation.js
      - name: OMR 019 mobile room header layout
        run: node tests/omr_mobile_room_layout_019_simulation.js
      - name: OMR 021 desktop/PWA V6 parity and safe fallback
        run: node tests/omr_desktop_pwa_v6_parity_021_simulation.js
      - name: Teacher PWA refresh restoration 020
        run: node tests/teacher_refresh_restore_020_simulation.js
      - name: OMR 010 teacher photo preview
        run: node tests/omr_photo_preview_010_simulation.js
      - name: OMR 002 room binding
        run: node tests/omr_room_binding_002_simulation.js
      - name: OMR 003 scoring parity
        run: node tests/omr_v4_scoring_003_simulation.js
      - name: OMR 004 canonical result write
        run: node tests/omr_result_write_004_simulation.js
      - name: OMR 005 batch UX
        run: node tests/omr_batch_ux_005_simulation.js
      - name: Teacher PWA Android Back navigation 011
        run: node tests/teacher_navigation_011_simulation.js
      - name: Teacher PWA password manager 012
        run: node tests/teacher_password_012_simulation.js
      - name: Teacher PWA 006
        run: node tests/teacher_pwa_006_simulation.js
      - name: Teacher PWA install entry 007
        run: node tests/teacher_pwa_install_entry_007_simulation.js
      - name: Teacher PWA Chromium installability 008
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/teacher-pwa-http.log 2>&1 &
          SERVER_PID=$!
          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --disable-background-timer-throttling             --remote-debugging-address=127.0.0.1             --remote-debugging-port=9236             --user-data-dir=/tmp/damsan-teacher-pwa-chrome             about:blank >/tmp/teacher-pwa-chrome.out 2>/tmp/teacher-pwa-chrome.log &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/teacher/index.html >/dev/null && curl -fsS http://127.0.0.1:9236/json/version >/dev/null; then break; fi
            sleep 1
          done
          set +e
          timeout 100s node tests/run_teacher_pwa_installability_probe_008.mjs
          PROBE_EXIT=$?
          set -e
          echo "=== Teacher PWA Chrome diagnostics ==="
          tail -n 120 /tmp/teacher-pwa-chrome.log || true
          exit "$PROBE_EXIT"
